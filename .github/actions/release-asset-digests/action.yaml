name: Release asset digests
description: >-
  Writes a "<sha256>  <name>" line, as sha256sum prints it, for each file in
  a directory or each asset of a GitHub release, sorted by name. Lists in
  this one format can be compared with diff.

inputs:
  directory:
    description: The directory whose files to list. Give this or release.
    required: false
  release:
    description: The tag of the release whose assets to list. Give this or directory.
    required: false
  output:
    description: The file to write the list to.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
        RELEASE: ${{ inputs.release }}
        OUTPUT: ${{ inputs.output }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        if [ -n "$DIRECTORY" ]; then
          (cd "$DIRECTORY" && sha256sum -- *) | LC_ALL=C sort -k2 > "$OUTPUT"
        # GitHub gives each asset's digest as "sha256:<hex>".
        elif ! gh release view "$RELEASE" --json assets \
          --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' | LC_ALL=C sort -k2 > "$OUTPUT"; then
          echo "::error::Couldn't read the assets of $RELEASE from GitHub. Re-run this job."
          exit 1
        fi
