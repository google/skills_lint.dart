name: Tap skills_lint
description: >-
  Sets up Homebrew and taps this checkout as google/skills-lint, the tap
  name that the README's install commands use. Optionally puts another
  skills_lint.rb in place of the checkout's Formula/skills_lint.rb.

inputs:
  formula:
    description: A skills_lint.rb to use instead of the checkout's.
    required: false

outputs:
  formula:
    description: The formula's full name, for brew commands.
    value: ${{ steps.tap.outputs.formula }}

runs:
  using: composite
  steps:
    - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
    # Homebrew loads no formula from an untrusted non-official tap. The tap
    # is a clone of the checkout, so a replacement formula goes into the
    # clone.
    - id: tap
      shell: bash
      env:
        TAP: google/skills-lint
        FORMULA_FILE: ${{ inputs.formula }}
      run: |
        brew tap "$TAP" "$GITHUB_WORKSPACE"
        brew trust "$TAP"
        if [ -n "$FORMULA_FILE" ]; then
          cp "$FORMULA_FILE" "$(brew --repo "$TAP")/Formula/skills_lint.rb"
        fi
        echo "formula=$TAP/skills_lint" >> "$GITHUB_OUTPUT"
