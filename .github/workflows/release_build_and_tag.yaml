# Builds and checks the skills_lint release assets. On main, it then tags the
# release, creates a draft GitHub release and starts
# release_publish.yaml on the tag. See RELEASING.md.
#
# - A pull request that changes the release files, or a manual run without a
#   version, is a dry run. It uploads the assets as the release-assets
#   artifact and creates nothing.
# - A manual run on main with the pubspec.yaml version releases it.
#
# The plan job works out which of these a run does; see
# release/lib/src/release_info.dart. Jobs that run Dart code from pub have
# read-only permissions.

name: Build and tag a release
run-name: >-
  ${{ inputs.version && format('Build and tag skills_lint {0}', inputs.version)
  || format('Dry run of the release build on {0}', github.head_ref || github.ref_name) }}

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/release_build_and_tag.yaml'
      - 'packages/skills_lint/pubspec.yaml'
      - 'packages/skills_lint/scripts/install.sh'
      - 'release/**'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version in packages/skills_lint/pubspec.yaml, to release it.
          Leave empty for a dry run.
        type: string

permissions: {}

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: release

jobs:
  plan:
    name: 'Plan: read the version and check it is ready to release'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
      mode: ${{ steps.prepare.outputs.mode }}
      formula-version: ${{ steps.prepare.outputs.formula-version }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      # The IDs of this job's artifacts. An artifact uploaded again under the
      # same name gets a new ID, so a download by ID can't get it.
      release-notes: ${{ steps.notes.outputs.artifact-id }}
      pubspec-lock: ${{ steps.lock.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      # The one resolution of this run. This job uploads its pubspec.lock,
      # which the release ships.
      - name: Resolve the dependencies
        run: dart pub get
      - name: Work out the release
        id: prepare
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          dart run bin/release.dart prepare --event "$EVENT" --ref-type "$REF_TYPE"
          --ref-name "$REF_NAME" --release-version "$RELEASE_VERSION"
          --notes-output "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
      # The token stays in this step, away from the Dart code of the next.
      - name: Read the protection of the pub.dev environment
        if: steps.prepare.outputs.mode == 'stage'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/pub.dev" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/pub.dev/deployment-branch-policies" > "$RUNNER_TEMP/branch-policies.json"
      - name: Check that the pub.dev environment guards publishing
        if: steps.prepare.outputs.mode == 'stage'
        run: >-
          dart run bin/release.dart check-pub-dev-environment
          --environment "$RUNNER_TEMP/environment.json" --branch-policies "$RUNNER_TEMP/branch-policies.json"
      - id: notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          retention-days: 30 # As long as GitHub lets a job be re-run.
      - id: lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 30 # As long as GitHub lets a job be re-run.

  check-release-tool:
    name: 'Check: release tool tests on ${{ matrix.os }}'
    needs: plan
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.pubspec-lock }}
          path: .
      - name: Get the release's dependencies
        run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  check-skills-lint:
    name: 'Check: skills_lint tests at this commit'
    needs: plan
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/skills_lint_workflow.yaml

  build-executable:
    name: 'Build: skills_lint executable for ${{ matrix.target }}'
    needs: plan
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One entry per target in releaseTargets in release/lib/src/archive.dart,
      # with the runner that builds it.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.pubspec-lock }}
          path: .
      - name: Get the release's dependencies
        run: dart pub get --enforce-lockfile
      - name: Build the archive
        env:
          TARGET: ${{ matrix.target }}
        run: dart run bin/release.dart package --target "$TARGET" --output-dir "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skills_lint-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 30 # As long as GitHub lets a job be re-run.

  build-assets:
    name: 'Build: release assets and pub.dev dry run'
    needs: [plan, build-executable]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      release-assets: ${{ steps.assets.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.pubspec-lock }}
          path: .
      - name: Get the release's dependencies
        run: dart pub get --enforce-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/dist
          pattern: skills_lint-*
          merge-multiple: true
      # The release ships the pubspec.lock that it was built with, so it can
      # be rebuilt. SHA256SUMS lists it.
      - name: Add pubspec.lock to the assets
        run: >-
          cp ../pubspec.lock "$RUNNER_TEMP/dist/" && cd "$RUNNER_TEMP/dist" &&
          sha256sum pubspec.lock > pubspec.lock.sha256
      - name: Check the checksums and write SHA256SUMS
        run: dart run bin/release.dart checksums "$RUNNER_TEMP/dist"
      # The release ships this formula. The step fails if the template can't
      # give a formula that reads back for this version and these archives.
      - name: Write the Homebrew formula
        if: needs.plan.outputs.formula-version != ''
        env:
          VERSION: ${{ needs.plan.outputs.formula-version }}
        run: >-
          dart run bin/release.dart homebrew-formula --version "$VERSION"
          --sha256sums "$RUNNER_TEMP/dist/SHA256SUMS" --output "$RUNNER_TEMP/dist/skills_lint.rb"
      - name: Write install.sh for the version
        run: dart run bin/release.dart install-script --output "$RUNNER_TEMP/dist/install.sh"
      - name: Check the package for pub.dev
        working-directory: packages/skills_lint
        run: dart pub publish --dry-run
      - id: assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 30 # As long as GitHub lets a job be re-run.

  check-homebrew-formula:
    name: 'Check: Homebrew formula with brew style and audit'
    needs: [plan, build-assets]
    if: needs.plan.outputs.formula-version != ''
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-assets.outputs.release-assets }}
          path: ${{ runner.temp }}/dist
      - id: tap
        uses: ./.github/actions/tap-skills-lint
        with:
          release-formula: ${{ runner.temp }}/dist/skills_lint.rb
      - run: brew style "$FORMULA"
        env:
          FORMULA: ${{ steps.tap.outputs.formula }}
      - run: brew audit --strict --formula "$FORMULA"
        env:
          FORMULA: ${{ steps.tap.outputs.formula }}

  stage-tag-and-draft:
    name: 'Stage: create the tag and the draft release, then start publishing'
    needs: [plan, check-release-tool, check-skills-lint, build-assets, check-homebrew-formula]
    # Runs only if every check passed. A prerelease has no Homebrew formula,
    # so its formula check skips.
    if: >-
      !cancelled() && needs.plan.outputs.mode == 'stage' &&
      needs.check-release-tool.result == 'success' &&
      needs.check-skills-lint.result == 'success' &&
      needs.build-assets.result == 'success' &&
      (needs.check-homebrew-formula.result == 'success' || needs.plan.outputs.formula-version == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the tag, and create the draft release and its assets.
      actions: write # Start release_publish.yaml on the tag.
      id-token: write # actions/attest: request a Sigstore signing certificate.
      attestations: write # actions/attest also stores each attestation in this repository.
      artifact-metadata: write # actions/attest: create the artifact storage record.
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-assets.outputs.release-assets }}
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.release-notes }}
          path: ${{ runner.temp }}
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*
      # A tag left by an earlier run is reused only if it points at this
      # commit.
      - name: Create the tag, or reuse it
        run: |
          if existing="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null)"; then
            if [ "$existing" != "$SHA" ]; then
              echo "::error::The tag $TAG points at $existing, not at this run's commit $SHA. Release the next version."
              exit 1
            fi
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" > /dev/null
          fi
      # The release starts as a draft so that every asset is attached before
      # it is published. Published releases can be immutable, which blocks
      # later uploads.
      - name: Create the draft release, unless this version has one
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          if ! is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            gh release create "$TAG" --draft --verify-tag --prerelease="$PRERELEASE" \
              --title "skills_lint $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/dist/*
          elif [ "$is_draft" != true ]; then
            echo "::error::$TAG is published already. Release the next version."
            exit 1
          fi
      # A re-run of this job reuses the draft that it made.
      - name: Check that the draft holds this build's assets
        run: |
          if ! gh release download "$TAG" --dir "$RUNNER_TEMP/draft"; then
            echo "::error::Couldn't download the draft of $TAG from GitHub. Re-run this job."
            exit 1
          fi
          if ! diff --recursive "$RUNNER_TEMP/dist" "$RUNNER_TEMP/draft"; then
            echo "::error::The draft of $TAG holds assets from another build. Delete it with \`gh release delete $TAG -R $GH_REPO\`, then re-run this job."
            exit 1
          fi
      - name: Start the publish workflow on the tag
        run: gh workflow run release_publish.yaml --ref "$TAG"
      - name: Write the job summary
        run: >-
          echo "Created the tag $TAG and its draft release. To publish them, open
          [Publish a tagged release]($GITHUB_SERVER_URL/$GH_REPO/actions/workflows/release_publish.yaml?query=branch%3A${TAG//+/%2B})."
          >> "$GITHUB_STEP_SUMMARY"
