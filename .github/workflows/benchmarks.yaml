name: benchmarks
permissions:
  contents: read

# Measures the CLI against a baseline build on the same runner and reports
# the results. It informs and never gates: a slowdown over the threshold adds
# a warning annotation, and a failed build or run adds a line to the job
# summary instead of failing the job. See
# packages/skills_lint/benchmark/README.md.
on:
  pull_request:
    paths:
      - 'packages/skills_lint/bin/**'
      - 'packages/skills_lint/lib/**'
      - 'packages/skills_lint/benchmark/**'
      - 'packages/skills_lint/pubspec.yaml'
      - '.github/workflows/benchmarks.yaml'
  push:
    branches: [ main ]
    paths:
      - 'packages/skills_lint/bin/**'
      - 'packages/skills_lint/lib/**'
      - 'packages/skills_lint/benchmark/**'
      - 'packages/skills_lint/pubspec.yaml'
      - '.github/workflows/benchmarks.yaml'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Commit, branch or tag to compare against, such as a release tag. Empty compares against the parent commit.'
        required: false
        default: ''

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: packages/skills_lint

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      - run: dart pub get

      # On a pull request the checkout is the merge commit, whose first
      # parent is the tip of the base branch. On a push it is the pushed
      # commit, whose first parent is the previous tip of main.
      - name: Check out the baseline
        id: baseline
        continue-on-error: true
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          sha="$(git rev-parse --verify "${BASELINE:-HEAD^1}^{commit}")"
          echo "BASELINE_SHA=$sha" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/baseline" "$sha"
          cd "$RUNNER_TEMP/baseline/packages/skills_lint"
          dart pub get

      - name: Run benchmarks
        id: benchmarks
        continue-on-error: true
        run: >-
          dart run benchmark/run_benchmarks.dart
          --baseline "$RUNNER_TEMP/baseline/packages/skills_lint"
          --json "$RUNNER_TEMP/benchmarks.json"
          --markdown "$RUNNER_TEMP/benchmarks.md"

      # The rule timings run in process, so the baseline timings build this
      # checkout's timing script against the baseline's code. The timings
      # are information only: these steps never fail the job, and without
      # baseline timings the report shows the candidate alone.
      - name: Time each rule on the baseline
        continue-on-error: true
        run: |
          baseline="$RUNNER_TEMP/baseline/packages/skills_lint"
          rm -rf "$baseline/benchmark"
          cp -R benchmark "$baseline/benchmark"
          cd "$baseline"
          dart compile exe --verbosity=error benchmark/rule_timings.dart -o "$RUNNER_TEMP/rule_timings_baseline"
          "$RUNNER_TEMP/rule_timings_baseline" --repo-root "$GITHUB_WORKSPACE" --json "$RUNNER_TEMP/rule_timings_baseline.json" > /dev/null

      - name: Time each rule
        id: timings
        continue-on-error: true
        run: |
          baseline_args=()
          if [ -f "$RUNNER_TEMP/rule_timings_baseline.json" ]; then
            baseline_args=(--baseline-json "$RUNNER_TEMP/rule_timings_baseline.json")
          fi
          dart compile exe --verbosity=error benchmark/rule_timings.dart -o "$RUNNER_TEMP/rule_timings"
          "$RUNNER_TEMP/rule_timings" --repo-root "$GITHUB_WORKSPACE" "${baseline_args[@]}" \
            --json "$RUNNER_TEMP/rule_timings.json" --markdown "$RUNNER_TEMP/rule_timings.md"

      - name: Write the job summary
        if: always()
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          BENCHMARKS_OUTCOME: ${{ steps.benchmarks.outcome }}
          TIMINGS_OUTCOME: ${{ steps.timings.outcome }}
        run: |
          {
            echo "Baseline: \`${BASELINE_SHA:-none}\`. Candidate: \`$(git rev-parse HEAD)\`."
            echo
            if [ "$BASELINE_OUTCOME" != success ]; then
              echo "> [!WARNING]"
              echo "> Checking out or fetching dependencies for the baseline failed. See the step log."
              echo
            fi
            if [ "$BENCHMARKS_OUTCOME" != success ]; then
              echo "> [!WARNING]"
              echo "> The benchmark run failed: a build failed or the CLI exited with an unexpected code. See the \"Run benchmarks\" step log. This job informs and does not gate the change."
              echo
            fi
            if [ "$TIMINGS_OUTCOME" != success ]; then
              echo "> [!WARNING]"
              echo "> The rule timings failed. See the \"Time each rule\" step log."
              echo
            fi
            if [ -f "$RUNNER_TEMP/benchmarks.md" ]; then
              cat "$RUNNER_TEMP/benchmarks.md"
            fi
            if [ -f "$RUNNER_TEMP/rule_timings.md" ]; then
              echo
              cat "$RUNNER_TEMP/rule_timings.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks
          path: |
            ${{ runner.temp }}/benchmarks.json
            ${{ runner.temp }}/benchmarks.md
            ${{ runner.temp }}/rule_timings.json
            ${{ runner.temp }}/rule_timings.md
            ${{ runner.temp }}/rule_timings_baseline.json
