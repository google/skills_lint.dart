name: Code Scanning

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.agents/**'
      - 'skills_lint.yaml'
      - 'skills/**'
      - 'packages/skills_lint/**'
      - '.github/workflows/code_scanning.yaml'
  push:
    branches: [ main ]
    paths:
      - '.agents/**'
      - 'skills_lint.yaml'
      - 'skills/**'
      - 'packages/skills_lint/**'
      - '.github/workflows/code_scanning.yaml'
  schedule:
    - cron: '0 0 * * 0' # weekly

jobs:
  sarif_scan:
    name: skills_lint (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        working-directory: packages/skills_lint
        run: dart pub get

      # skills_lint exits with code 1 if lint violations are found and 78 if the
      # configuration has errors, which fails this step. Configuration errors
      # print to this step's log. The exit code is saved for Show findings.
      - name: Generate SARIF report
        id: lint
        run: dart run packages/skills_lint/bin/skills_lint.dart --format=sarif > skills-lint.sarif || { code=$?; echo "exit-code=$code" >> "$GITHUB_OUTPUT"; exit "$code"; }

      # Upload SARIF findings to GitHub Code Scanning, also after a lint failure.
      # Skip upload if setup failed before lint generation ran, or on fork PRs
      # where security-events: write is unavailable.
      - name: Upload SARIF report to GitHub Code Scanning
        if: ${{ always() && steps.lint.conclusion != 'skipped' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: skills-lint.sarif
          category: skills_lint

      # With --format=sarif, findings go only to the SARIF file, so rerun in text format to print them in the log.
      # Skip it after configuration errors (exit code 78), which the lint step already printed.
      - name: Show findings
        if: ${{ failure() && steps.lint.outcome == 'failure' && steps.lint.outputs.exit-code != '78' }}
        run: dart run packages/skills_lint/bin/skills_lint.dart
