# Formats, analyzes and tests the release tool in release/. The one
# definition of these checks: release_build_and_tag.yaml calls it, both in
# pull request dry runs and in releases.

name: release tool
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      pubspec-lock:
        description: >-
          ID of an artifact holding the pubspec.lock to test with. Empty
          resolves the dependencies with `dart pub get`.
        type: string
        default: ''

defaults:
  run:
    shell: bash
    working-directory: release

jobs:
  analyze_and_test:
    name: 'Release tool tests on ${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - if: inputs.pubspec-lock != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.pubspec-lock }}
          path: .
      - name: Get the dependencies from the given pubspec.lock
        if: inputs.pubspec-lock != ''
        run: dart pub get --enforce-lockfile
      - name: Get the dependencies
        if: inputs.pubspec-lock == ''
        run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
