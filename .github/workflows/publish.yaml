# A CI configuration to auto-publish pub packages.

name: Publish

permissions:
  contents: read

on:
  pull_request:
  push:
    # Must match the tag pattern configured at
    # https://pub.dev/packages/skills_lint/admin (`skills_lint-v{{version}}`).
    tags:
      - 'skills_lint-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    if: ${{ github.repository_owner == 'google' }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@5576a85fa69edea4343a1b601d4c3e755fcf6ad4 # main
    permissions:
      id-token: write # Required for authentication using OIDC
      pull-requests: write # Required for writing the pull request note
