# Checks pull requests with the dart-lang/ecosystem publish workflow, which
# validates the package and comments on the pull request.
#
# It never publishes: that workflow publishes only for `push` events, and this
# file has no `push` trigger. release.yaml publishes releases. See
# RELEASING.md.

name: Publish

permissions:
  contents: read

on:
  pull_request:

jobs:
  publish:
    if: ${{ github.repository_owner == 'google' }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@60fca9f1270a0819b3ee9caf74b08fb0a212e4cb # main
    permissions:
      # The publish job of the called workflow requests id-token: write. It
      # runs only for push events, but GitHub rejects a call that grants less
      # than a called job requests.
      id-token: write
      pull-requests: write # Required for writing the pull request note
