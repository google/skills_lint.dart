# A CI configuration to auto-publish pub packages.

name: Publish

permissions:
  contents: read

on:
  pull_request:
  push:
    # The published package lives at `packages/skills_lint` rather than at the
    # repository root, so `package:firehose` treats this as a monorepo and
    # requires the package name in the tag. A bare `v0.5.2` tag is rejected
    # with "Tag does not include package name", so it is not a trigger here.
    #
    # The tag pattern configured at
    # https://pub.dev/packages/skills_lint/admin must agree with this pattern
    # (`skills_lint-v{{version}}`). If the two disagree, pub.dev refuses the
    # OIDC token and publishing fails with "Insufficient permissions".
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    if: ${{ github.repository_owner == 'google' }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@60fca9f1270a0819b3ee9caf74b08fb0a212e4cb # main
    permissions:
      id-token: write # Required for authentication using OIDC
      pull-requests: write # Required for writing the pull request note
