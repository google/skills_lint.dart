# Publishes a release that release_build_and_tag.yaml staged: the package to
# pub.dev, then the draft GitHub release, then a branch that updates the
# Homebrew formula. release_build_and_tag.yaml starts this workflow on the
# release's tag, and pub.dev accepts a publish only from a run on that tag.
# See RELEASING.md.
#
# Only the pub.dev job runs Dart code from pub, with the pubspec.lock that
# the verify job checked.

name: Publish a tagged release
run-name: Publish ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-publish-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  verify-draft:
    name: "Verify: the draft release is what this commit's build made"
    runs-on: ubuntu-latest
    permissions:
      contents: write # Read draft releases, which needs push access.
      attestations: read # gh attestation verify fetches them from this repository's API.
    outputs:
      version: ${{ steps.check.outputs.version }}
      # Whether the release has a Homebrew formula: every release that isn't
      # a prerelease does.
      homebrew: ${{ steps.check.outputs.homebrew }}
      # Later jobs download by ID, so an artifact uploaded again under the same
      # name can't replace what this job verified.
      verified-release: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # Checks out .github/actions only, for the release-asset-digests action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      # Anyone with push access can change a draft, so every asset must carry
      # an attestation from the build of this commit, and the files that
      # SHA256SUMS lists must match it. Without --source-digest, the assets
      # of an earlier release would pass too.
      - name: Check the draft and its assets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || [[ "$TAG" != skills_lint-v* ]]; then
            echo "::error::Run this workflow on a skills_lint-v<version> tag. Build and tag a release starts it."
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::$TAG has no draft release. Run Build and tag a release on main to stage it."
            exit 1
          fi
          changed() {
            echo "::error::The draft of $TAG doesn't match the build of this commit, or GitHub couldn't be reached. Re-run this job once. If it fails again, delete the draft, then re-run the Stage job of the build."
            exit 1
          }
          version="${TAG#skills_lint-v}"
          # A version with a `-` suffix is a prerelease, which has no formula.
          if [[ "$version" == *-* ]]; then homebrew=false; else homebrew=true; fi
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          sha256sum --check --strict SHA256SUMS || changed
          test -f install.sh || changed
          [ "$homebrew" = false ] || test -f skills_lint.rb || changed
          for asset in *; do
            gh attestation verify "$asset" -R "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release_build_and_tag.yaml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" || changed
          done
          mkdir "$RUNNER_TEMP/verified"
          cp pubspec.lock "$RUNNER_TEMP/verified/"
          if [ "$homebrew" = true ]; then cp skills_lint.rb "$RUNNER_TEMP/verified/"; fi
          {
            echo "version=$version"
            echo "homebrew=$homebrew"
          } >> "$GITHUB_OUTPUT"
      - name: List the verified asset digests
        uses: ./.github/actions/release-asset-digests
        with:
          directory: ${{ runner.temp }}/assets
          output: ${{ runner.temp }}/verified/assets.sha256
      # assets.sha256 is what the GitHub release job compares the release
      # with, the pub.dev job installs the dependencies in pubspec.lock, and
      # the Homebrew job pushes skills_lint.rb.
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release
          path: ${{ runner.temp }}/verified/
          if-no-files-found: error
          retention-days: 30 # As long as GitHub lets a job be re-run.

  publish-to-pub-dev:
    name: 'Publish 1 of 2: package to pub.dev (needs approval)'
    needs: verify-draft
    # Assumes these settings:
    # - https://pub.dev/packages/skills_lint/admin publishes from
    #   workflow_dispatch runs on tags matching skills_lint-v{{version}}, not
    #   from push runs, and requires the GitHub Actions environment pub.dev.
    # - The repository's pub.dev environment allows only skills_lint-v* tags
    #   and has a required reviewer, so this job waits for approval. The
    #   build workflow's Stage job checks this.
    environment: pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # pub.dev: authenticate with a GitHub OIDC token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Also gets the OIDC token that `dart pub publish` sends to pub.dev.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-draft.outputs.verified-release }}
          path: ${{ runner.temp }}/verified
      - name: Get the release's dependencies
        run: cp "$RUNNER_TEMP/verified/pubspec.lock" . && dart pub get --enforce-lockfile
      # Skips the upload when pub.dev has the version, so that a run started
      # again after a failed GitHub release job only publishes the GitHub
      # release.
      - name: Publish the package
        working-directory: packages/skills_lint
        env:
          VERSION: ${{ needs.verify-draft.outputs.version }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pub.dev/api/packages/skills_lint/versions/$VERSION")"
          case "$status" in
            200) echo "pub.dev has skills_lint $VERSION already." ;;
            404) dart pub publish --force ;;
            *) echo "::error::pub.dev returned HTTP $status. Re-run this job when pub.dev answers."; exit 1 ;;
          esac

  publish-github-release:
    name: 'Publish 2 of 2: GitHub release, then confirm it is locked'
    needs: [verify-draft, publish-to-pub-dev]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Read and publish the draft; reading a draft needs push access.
    steps:
      # Checks out .github/actions only, for the release-asset-digests action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-draft.outputs.verified-release }}
          path: ${{ runner.temp }}/verified
      # The draft can change until it is published, and while the pub.dev job
      # waits for approval. So its asset digests are compared with what the
      # verify job checked before publishing, and again after, when immutable
      # releases have frozen them.
      - name: List the draft's asset digests
        uses: ./.github/actions/release-asset-digests
        with:
          release: ${{ github.ref_name }}
          output: ${{ runner.temp }}/draft.sha256
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! diff "$RUNNER_TEMP/verified/assets.sha256" "$RUNNER_TEMP/draft.sha256"; then
            echo "::error::The draft of $TAG changed after the verify job checked it. Delete the draft, then re-run the Stage job of the build that made it."
            exit 1
          fi
          if ! is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            echo "::error::Couldn't read $TAG from GitHub. Re-run this job."
            exit 1
          fi
          # A re-run of this job finds the release published already.
          if [ "$is_draft" = true ]; then
            gh release edit "$TAG" --draft=false
          fi
      - name: List the published release's asset digests
        uses: ./.github/actions/release-asset-digests
        with:
          release: ${{ github.ref_name }}
          output: ${{ runner.temp }}/published.sha256
      - name: Check that the release is the verified build, and locked
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! diff "$RUNNER_TEMP/verified/assets.sha256" "$RUNNER_TEMP/published.sha256"; then
            echo "::error::The published release $TAG differs from the verified build. Re-run this job once. If it fails again, delete the release, tell the maintainers, and release the next version."
            exit 1
          fi
          # A read of the release can lag behind the publish, or fail.
          for attempt in 1 2 3; do
            immutable="$(gh release view "$TAG" --json isImmutable --jq .isImmutable || true)"
            [ "$immutable" = true ] && break
            sleep 5
          done
          if [ "$immutable" != true ]; then
            echo "::error::$TAG is published, but GitHub doesn't report it as immutable. Re-run this job once. If it fails again, turn on immutable releases, delete the release, and release the next version."
            exit 1
          fi
          echo "Published $TAG to pub.dev and [GitHub]($(gh release view "$TAG" --json url --jq .url))." >> "$GITHUB_STEP_SUMMARY"

  push-homebrew-update:
    name: 'Homebrew: push the formula update and link its pull request'
    needs: [verify-draft, publish-github-release]
    if: needs.verify-draft.outputs.homebrew == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the formula branch.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-draft.outputs.verified-release }}
          path: ${{ runner.temp }}/verified
      - name: Push the branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify-draft.outputs.version }}
        run: |
          branch="homebrew/$TAG"
          git switch -c "$branch"
          cp "$RUNNER_TEMP/verified/skills_lint.rb" Formula/skills_lint.rb
          git add Formula/skills_lint.rb
          # 41898282 is the user ID of github-actions[bot].
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update the Homebrew formula to $VERSION"
          gh auth setup-git
          git push origin "$branch"
          echo "Open the pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
