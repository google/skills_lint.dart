# Publishes a staged release from its tag: the package to pub.dev, then the
# draft GitHub release, then a branch that updates the Homebrew formula.
# pub.dev accepts a publish only from a run on the release's tag. See
# RELEASING.md.
#
# Only the verify and pub.dev jobs run Dart code from pub, with the draft's
# pubspec.lock once its attestation is checked. Neither has write
# permission, apart from the pub.dev job's OIDC token.

name: Publish a tagged release
run-name: Publish ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-publish-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  download-draft:
    name: "Download: the draft release, for the verify job"
    runs-on: ubuntu-latest
    permissions:
      contents: write # Read draft releases, which needs push access.
    outputs:
      # The ID of the downloaded draft. An artifact uploaded again under the
      # same name gets a new ID, so a download by ID can't get it.
      draft-release: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Download the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir "$RUNNER_TEMP/draft"
          if ! gh release view "$TAG" --json isDraft,isPrerelease > "$RUNNER_TEMP/draft/release.json" ||
            ! gh release download "$TAG" --dir "$RUNNER_TEMP/draft/assets"; then
            echo "::error::Couldn't download the release of $TAG. Run this workflow on a skills_lint-v<version> tag that Build and tag a release staged, or re-run this job."
            exit 1
          fi
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-release
          path: ${{ runner.temp }}/draft/
          if-no-files-found: error
          retention-days: 30 # As long as GitHub lets a job be re-run.

  verify-draft:
    name: "Verify: the draft release is what this commit's build made"
    needs: download-draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read # gh attestation verify fetches them from this repository's API.
      pull-requests: read # Link the pull request that merged this commit.
    outputs:
      version: ${{ steps.verify.outputs.version }}
      # Whether the release has a Homebrew formula: every release that isn't
      # a prerelease does.
      homebrew: ${{ steps.verify.outputs.homebrew }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.download-draft.outputs.draft-release }}
          path: ${{ runner.temp }}/draft
      # The verify step runs Dart with the draft's pubspec.lock, so the
      # lockfile must first be shown to come from the build of this commit.
      - name: Check that the draft's pubspec.lock is from this commit's build
        run: |
          if ! gh attestation verify "$RUNNER_TEMP/draft/assets/pubspec.lock" -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release_build_and_tag.yaml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA"; then
            echo "::error::The draft's pubspec.lock is missing or isn't from the build of this commit. Re-run this job once. If it fails again, delete the draft, then re-run the Stage job of the build."
            exit 1
          fi
      - name: Get the release's dependencies
        run: cp "$RUNNER_TEMP/draft/assets/pubspec.lock" . && dart pub get --enforce-lockfile
      # Anyone with push access can change a draft, so this checks every
      # asset against SHA256SUMS and the build's attestations. See
      # release/lib/src/draft_release.dart.
      - name: Check the draft and its assets
        id: verify
        working-directory: release
        env:
          TAG: ${{ github.ref_name }}
        run: >-
          dart run bin/release.dart verify-draft --ref-type "$GITHUB_REF_TYPE" --tag "$TAG"
          --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          --release-json "$RUNNER_TEMP/draft/release.json" --assets "$RUNNER_TEMP/draft/assets"
          --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
      # For the approver of the pub.dev job, below the build runs.
      - name: Link the pull request in the summary
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls"
          --jq '.[] | select(.merged_at) | "- Pull request: \(.html_url)"' >> "$GITHUB_STEP_SUMMARY"

  publish-to-pub-dev:
    name: 'Publish 1 of 2: package to pub.dev (needs approval)'
    needs: [download-draft, verify-draft]
    # Assumes these settings:
    # - https://pub.dev/packages/skills_lint/admin publishes from
    #   workflow_dispatch runs on tags matching skills_lint-v{{version}}, not
    #   from push runs, and requires the GitHub Actions environment pub.dev.
    # - The repository's pub.dev environment allows only skills_lint-v* tags
    #   and has a required reviewer, so this job waits for approval.
    environment: pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # pub.dev: authenticate with a GitHub OIDC token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Also gets the OIDC token that `dart pub publish` sends to pub.dev.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.download-draft.outputs.draft-release }}
          path: ${{ runner.temp }}/verified
      - name: Get the release's dependencies
        run: cp "$RUNNER_TEMP/verified/assets/pubspec.lock" . && dart pub get --enforce-lockfile
      # Skips the upload when pub.dev has the version, so this job can run
      # again for a version that it published.
      - name: Publish the package
        working-directory: packages/skills_lint
        env:
          VERSION: ${{ needs.verify-draft.outputs.version }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pub.dev/api/packages/skills_lint/versions/$VERSION")"
          case "$status" in
            200) echo "pub.dev has skills_lint $VERSION already." ;;
            404) dart pub publish --force ;;
            *) echo "::error::pub.dev returned HTTP $status. Re-run this job when pub.dev answers."; exit 1 ;;
          esac

  publish-github-release:
    name: 'Publish 2 of 2: GitHub release, then confirm it is locked'
    needs: [download-draft, verify-draft, publish-to-pub-dev]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Read and publish the draft; reading a draft needs push access.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.download-draft.outputs.draft-release }}
          path: ${{ runner.temp }}/verified
      # The draft can change until it is published, even while this run waits
      # for approval. So its files are compared with the verified ones before
      # publishing, and again after, when immutable releases have frozen them.
      - name: Publish the draft release, if it is still the verified build
        run: |
          if ! gh release download "$TAG" --dir "$RUNNER_TEMP/draft"; then
            echo "::error::Couldn't download $TAG from GitHub. Re-run this job."
            exit 1
          fi
          if ! diff --recursive "$RUNNER_TEMP/verified/assets" "$RUNNER_TEMP/draft"; then
            echo "::error::The draft of $TAG changed after the verify job checked it. Delete the draft, then re-run the Stage job of the build that made it."
            exit 1
          fi
          if ! is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            echo "::error::Couldn't read $TAG from GitHub. Re-run this job."
            exit 1
          fi
          # A re-run of this job finds the release published already.
          if [ "$is_draft" = true ]; then
            gh release edit "$TAG" --draft=false
          fi
      - name: Check that the release is the verified build, and locked
        run: |
          if ! gh release download "$TAG" --dir "$RUNNER_TEMP/published"; then
            echo "::error::Couldn't download $TAG from GitHub. Re-run this job."
            exit 1
          fi
          if ! diff --recursive "$RUNNER_TEMP/verified/assets" "$RUNNER_TEMP/published"; then
            echo "::error::The published release $TAG differs from the verified build. Re-run this job once. If it fails again, delete the release, tell the maintainers, and release the next version."
            exit 1
          fi
          # A read of the release can lag behind the publish, or fail.
          for attempt in 1 2 3; do
            immutable="$(gh release view "$TAG" --json isImmutable --jq .isImmutable || true)"
            [ "$immutable" = true ] && break
            sleep 5
          done
          if [ "$immutable" != true ]; then
            echo "::error::$TAG is published, but GitHub doesn't report it as immutable. Re-run this job once. If it fails again, turn on immutable releases, delete the release, and release the next version."
            exit 1
          fi
          echo "Published $TAG to pub.dev and [GitHub]($(gh release view "$TAG" --json url --jq .url))." >> "$GITHUB_STEP_SUMMARY"

  push-homebrew-update:
    name: 'Homebrew: push the formula update and link its pull request'
    needs: [download-draft, verify-draft, publish-github-release]
    if: needs.verify-draft.outputs.homebrew == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the formula branch.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.download-draft.outputs.draft-release }}
          path: ${{ runner.temp }}/verified
      - name: Push the branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify-draft.outputs.version }}
        run: |
          branch="homebrew/$TAG"
          git switch -c "$branch"
          cp "$RUNNER_TEMP/verified/assets/skills_lint.rb" Formula/skills_lint.rb
          git add Formula/skills_lint.rb
          # 41898282 is the user ID of github-actions[bot].
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update the Homebrew formula to $VERSION"
          gh auth setup-git
          git push origin "$branch"
          echo "Open the pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
