name: skills_lint
permissions:
  contents: read

on:
  pull_request:
    paths:
      # Formula/, because repo_test/homebrew_formula_test.dart checks it.
      - 'Formula/**'
      - '.agents/**'
      - 'skills_lint.yaml'
      - 'skills/**'
      - 'packages/skills_lint/**'
      - 'release/**'
      # All workflows and actions, because repo_test/action_pin_convention_test.dart checks the pins in each.
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [ main ]
    paths:
      # Formula/, because repo_test/homebrew_formula_test.dart checks it.
      - 'Formula/**'
      - '.agents/**'
      - 'skills_lint.yaml'
      - 'skills/**'
      - 'packages/skills_lint/**'
      - 'release/**'
      # All workflows and actions, because repo_test/action_pin_convention_test.dart checks the pins in each.
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: '0 0 * * 0' # weekly
  workflow_call:
    inputs:
      pubspec-lock:
        description: >-
          ID of an artifact holding the pubspec.lock that a release ships. The
          release tool is tested with it. Empty resolves the dependencies with
          `dart pub get`.
        type: string
        default: ''

defaults:
  run:
    working-directory: packages/skills_lint

jobs:
  analyze_and_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
        include:
          # Lowest SDK and dependency versions the pubspecs allow. Ubuntu
          # only. repo_test/sdk_lower_bound_test.dart checks `sdk`.
          - os: ubuntu-latest
            sdk: 3.12.0
            lower_bound: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - run: dart pub get

      - run: dart analyze --fatal-infos

      - name: Run cognitive complexity check
        run: dart run cognitive_complexity --fail-threshold 20 --exclude 'third_party/**' --exclude 'packages/skills_lint/evals/test_data/**' --exclude '.worktrees/**' --exclude '.claude/**' .
        working-directory: .

      # One step per test directory, so a failure names its kind. See "Where
      # tests go" in CONTRIBUTING.md. Plain `dart test` runs test/ only. Each
      # later test step also runs when an earlier test step fails, so one run
      # reports every kind of failure.
      - name: Run tests
        id: product_tests
        run: dart test

      - name: Run repo tests
        id: repo_tests
        if: success() || steps.product_tests.conclusion == 'failure'
        run: dart test repo_test

      # Compiles the CLI the way a release does and runs the CLI tests from
      # test/ against the binary.
      - name: Run compiled CLI tests
        if: success() || steps.product_tests.conclusion == 'failure' || steps.repo_tests.conclusion == 'failure'
        run: dart test compiled_test

      - name: Verify example
        run: dart run example/main.dart

      - name: Verify API boundary runner
        run: dart run example/api_boundary_runner/bin/main.dart

      # `lower_bound` is set only by the lower-bound `include` entry above.
      # After the downgrade, analysis checks that the declared dependency
      # floors cover the APIs we use. Tests would mostly exercise old dev
      # tooling, so they don't run.
      - name: Resolve the lowest allowed dependency versions
        if: matrix.lower_bound
        run: dart pub downgrade

      - name: Analyze with the lowest allowed dependency versions
        if: matrix.lower_bound
        run: dart analyze --fatal-infos

  # Released CHANGELOG sections stay as published. A pull request may change
  # the `-wip` section and add sections above the released ones, but not
  # change any line from the first released `## ` heading down.
  released_changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that released CHANGELOG sections are unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          released() { awk '/^## / && !/-wip$/ { p = 1 } p'; }
          git show "$BASE_SHA:packages/skills_lint/CHANGELOG.md" | released > /tmp/base.md
          released < CHANGELOG.md > /tmp/head.md
          if ! tail -n "$(wc -l < /tmp/base.md)" /tmp/head.md | cmp -s - /tmp/base.md; then
            echo "::error file=packages/skills_lint/CHANGELOG.md::A released CHANGELOG section changed. Change only the -wip section."
            diff /tmp/base.md /tmp/head.md || true
            exit 1
          fi

  # The release scripts in release/, on the SDK and OSes that
  # release_build_and_tag.yaml builds with. They only need to work there, so
  # they have no lower-bound entry; see repo_test/sdk_lower_bound_test.dart.
  release_tool:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - if: inputs.pubspec-lock != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.pubspec-lock }}
          path: .
      - name: Get the dependencies from the given pubspec.lock
        if: inputs.pubspec-lock != ''
        run: dart pub get --enforce-lockfile
      - name: Get the dependencies
        if: inputs.pubspec-lock == ''
        run: dart pub get

      - run: dart format --output=none --set-exit-if-changed ../../release
      - run: dart analyze --fatal-infos ../../release
      - run: dart test ../../release/test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - run: dart pub get

      - name: Collect coverage
        run: dart test --coverage=coverage

      - name: Format coverage to LCOV
        run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib

      # Action steps do not inherit defaults.run.working-directory, so this
      # path is relative to the repository root.
      - name: Enforce coverage threshold
        uses: VeryGoodOpenSource/very_good_coverage@c953fca3e24a915e111cc6f55f03f756dcb3964c # v3 # zizmor: ignore[archived-uses]
        with:
          path: packages/skills_lint/coverage/lcov.info
          min_coverage: 73
          exclude: '**/*.g.dart'

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - run: dart pub get

      - run: dart format --output=none --set-exit-if-changed .

  pana_score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - run: dart pub get

      - name: Install pana
        run: dart pub global activate pana

      # pana --exit-code-threshold N fails the step when
      # (max - granted) > N. Threshold 0 means any point drop fails;
      # current package score is 160/160 and we want to keep it there.
      - name: Pana score gate (160/160 required)
        run: dart pub global run pana --no-warning --exit-code-threshold 0 .
