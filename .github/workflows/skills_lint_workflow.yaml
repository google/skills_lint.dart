name: skills_lint
permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.agents/**'
      - 'skills_lint.yaml'
      - 'skills/**'
      - 'packages/skills_lint/**'
      - 'release/**'
      - '.github/workflows/skills_lint_workflow.yaml'
  push:
    branches: [ main ]
    paths:
      - '.agents/**'
      - 'skills_lint.yaml'
      - 'skills/**'
      - 'packages/skills_lint/**'
      - 'release/**'
      - '.github/workflows/skills_lint_workflow.yaml'
  schedule:
    - cron: '0 0 * * 0' # weekly

defaults:
  run:
    working-directory: packages/skills_lint

jobs:
  analyze_and_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
        include:
          # Lowest SDK and dependency versions the pubspecs allow. Ubuntu
          # only. repo_test/sdk_lower_bound_test.dart checks `sdk`.
          - os: ubuntu-latest
            sdk: 3.12.0
            downgrade: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: ${{ matrix.sdk }}

      - run: dart pub get

      # release.yaml tests the release package on stable. These steps test it
      # on the lowest SDK that its pubspec allows.
      - name: Analyze the release package
        if: matrix.downgrade
        working-directory: release
        run: dart analyze --fatal-infos

      - name: Test the release package
        if: matrix.downgrade
        working-directory: release
        run: dart test

      # `downgrade` is set only by the lower-bound `include` entry above.
      - name: Resolve the lowest allowed dependency versions
        if: matrix.downgrade
        run: dart pub downgrade

      - run: dart analyze --fatal-infos

      - name: Run cognitive complexity check
        run: dart run cognitive_complexity --fail-threshold 20 --exclude 'third_party/**' --exclude 'packages/skills_lint/evals/test_data/**' .
        working-directory: .

      # One step per test directory, so a failure names its kind. See "Where
      # tests go" in CONTRIBUTING.md. Plain `dart test` runs test/ only. The
      # repo test step also runs when the product tests fail, so one run
      # reports both kinds of failure.
      - name: Run tests
        id: product_tests
        run: dart test

      - name: Run repo tests
        if: success() || steps.product_tests.conclusion == 'failure'
        run: dart test repo_test

      - name: Verify example
        run: dart run example/main.dart

      - name: Verify API boundary runner
        run: dart run example/api_boundary_runner/bin/main.dart

      - name: Analyze the release package with the lowest allowed dependency versions
        if: matrix.downgrade
        working-directory: release
        run: dart analyze --fatal-infos

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      - run: dart pub get

      - name: Collect coverage
        run: dart test --coverage=coverage

      - name: Format coverage to LCOV
        run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib

      # Action steps do not inherit defaults.run.working-directory, so this
      # path is relative to the repository root.
      - name: Enforce coverage threshold
        uses: VeryGoodOpenSource/very_good_coverage@c953fca3e24a915e111cc6f55f03f756dcb3964c # v3 # zizmor: ignore[archived-uses]
        with:
          path: packages/skills_lint/coverage/lcov.info
          min_coverage: 73
          exclude: '**/*.g.dart'

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      - run: dart pub get

      - run: dart format --output=none --set-exit-if-changed .

  pana_score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      - run: dart pub get

      - name: Install pana
        run: dart pub global activate pana

      # pana --exit-code-threshold N fails the step when
      # (max - granted) > N. Threshold 0 means any point drop fails;
      # current package score is 160/160 and we want to keep it there.
      - name: Pana score gate (160/160 required)
        run: dart pub global run pana --no-warning --exit-code-threshold 0 .
