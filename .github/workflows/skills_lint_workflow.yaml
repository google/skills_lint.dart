name: skills_lint
permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.agents/**'
      - 'skills_lint.yaml'
      - 'skills/**'
      - 'packages/skills_lint/**'
      - '.github/workflows/skills_lint_workflow.yaml'
  push:
    branches: [ main ]
    paths:
      - '.agents/**'
      - 'skills_lint.yaml'
      - 'skills/**'
      - 'packages/skills_lint/**'
      - '.github/workflows/skills_lint_workflow.yaml'
  schedule:
    - cron: '0 0 * * 0' # weekly

defaults:
  run:
    working-directory: packages/skills_lint

jobs:
  analyze_and_test:
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      - run: dart pub get

      - run: dart analyze --fatal-infos

      - name: Run cognitive complexity check
        run: dart run cognitive_complexity --fail-threshold 20 packages/skills_lint/bin packages/skills_lint/lib packages/skills_lint/test packages/skills_lint/example packages/skills_lint/skills .agents/skills
        working-directory: .

      - run: dart test

      - name: Verify example
        run: dart run example/main.dart

      - name: Verify API boundary runner
        run: dart run example/api_boundary_runner/bin/main.dart

      - name: Validate benchmarks (smoke test)
        run: dart run bench_press validate -t jit,aot benchmark/

      - name: Generate SARIF report
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        working-directory: .
        run: |
          set +e
          dart run packages/skills_lint/bin/skills_lint.dart -d .agents/skills --format=sarif > skills-lint.sarif
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 1 ]; then
            echo "skills_lint failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Upload SARIF report to GitHub Code Scanning
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: skills-lint.sarif
          category: skills_lint


  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      - run: dart pub get

      - name: Collect coverage
        run: dart test --coverage=coverage

      - name: Format coverage to LCOV
        run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib

      # Action steps do not inherit defaults.run.working-directory, so this
      # path is relative to the repository root.
      - name: Enforce coverage threshold
        uses: VeryGoodOpenSource/very_good_coverage@c953fca3e24a915e111cc6f55f03f756dcb3964c # v3 # zizmor: ignore[archived-uses]
        with:
          path: packages/skills_lint/coverage/lcov.info
          min_coverage: 73
          exclude: '**/*.g.dart'

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      - run: dart pub get

      - run: dart format --output=none --set-exit-if-changed .

  pana_score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      - run: dart pub get

      - name: Install pana
        run: dart pub global activate pana

      # pana --exit-code-threshold N fails the step when
      # (max - granted) > N. Threshold 0 means any point drop fails;
      # current package score is 160/160 and we want to keep it there.
      - name: Pana score gate (160/160 required)
        run: dart pub global run pana --no-warning --exit-code-threshold 0 .
