# Checks the Homebrew formula in Formula/. Formula/README.md says what each
# job checks and how to make the `Homebrew` job a required status check.
#
# - `changes` decides whether the formula needs checking. The workflow has no
#   `paths` filter: a required check whose workflow a path filter skips stays
#   pending and blocks the pull request.
# - `style` runs `brew style` and `brew audit --strict`. Neither downloads the
#   release archives.
# - `install` installs the formula and runs its test block on each platform
#   that has an archive. It runs only when the formula has no PLACEHOLDER
#   marker, because placeholder checksums cannot match any download.
# - `homebrew` always runs, and fails if any job above failed or was
#   cancelled. A skipped job passes. Make this job the required check.
#
# Homebrew has no bottles for this formula, so `brew install` treats it as a
# build from source: it checks for the Command Line Tools on macOS before it
# downloads the prebuilt executable.

name: Homebrew

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, to catch Homebrew changes that break the formula
  workflow_dispatch:

permissions: {}

concurrency:
  group: homebrew-${{ github.ref }}
  cancel-in-progress: true

env:
  TAP: google/skills-lint
  FORMULA: google/skills-lint/skills_lint

jobs:
  changes:
    name: Find formula changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      formula: ${{ steps.diff.outputs.formula }}
    steps:
      # Formula/ is the formula, release/ builds the archives it installs and
      # lists their targets, and this file runs the checks.
      - name: Check the changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "formula=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if grep -Eq '^(Formula/|release/|\.github/workflows/homebrew\.yaml$)' <<< "$files"; then
            echo "formula=true" >> "$GITHUB_OUTPUT"
          else
            echo "formula=false" >> "$GITHUB_OUTPUT"
          fi

  style:
    name: brew style and audit
    needs: changes
    if: needs.changes.outputs.formula == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      released: ${{ steps.placeholders.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
      # Homebrew loads no formula from an untrusted non-official tap.
      - name: Tap and trust this checkout
        run: |
          brew tap "$TAP" "$GITHUB_WORKSPACE"
          brew trust "$TAP"
      - run: brew style "$FORMULA"
      - run: brew audit --strict --formula "$FORMULA"
      - name: Check for placeholder values
        id: placeholders
        run: |
          if grep -q PLACEHOLDER Formula/skills_lint.rb; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  install:
    name: brew install and test (${{ matrix.target }})
    needs: style
    if: needs.style.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        # One entry per archive, on the runner that builds it.
        # repo_test/homebrew_formula_test.dart checks this list against
        # release/lib/src/archive.dart.
        include:
          - target: macos-arm64
            os: macos-latest
          - target: macos-x64
            os: macos-26-intel
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
      # Homebrew loads no formula from an untrusted non-official tap.
      - name: Tap and trust this checkout
        run: |
          brew tap "$TAP" "$GITHUB_WORKSPACE"
          brew trust "$TAP"
      - run: brew install "$FORMULA"
      - run: brew test "$FORMULA"
      - run: brew audit --strict --online --formula "$FORMULA"

  homebrew:
    name: Homebrew
    needs: [changes, style, install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
