# Checks the Homebrew formula in Formula/ on each pull request and weekly.
# There is no `paths` filter, because a required check that a path filter
# skips stays pending; the `changes` job skips the brew jobs instead, and the
# `homebrew` job always reports, so it is the check to require.

name: Homebrew

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, to catch Homebrew changes that break the formula
  workflow_dispatch:

permissions: {}

concurrency:
  group: homebrew-${{ github.ref }}
  cancel-in-progress: true

env:
  TAP: google/skills-lint
  FORMULA: google/skills-lint/skills_lint

jobs:
  changes:
    name: Find formula changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      formula: ${{ steps.diff.outputs.formula }}
    steps:
      # Formula/ is the formula, release/ builds the archives it installs and
      # lists their targets, and this file runs the checks.
      - name: Check the changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "formula=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if grep -Eq '^(Formula/|release/|\.github/workflows/homebrew\.yaml$)' <<< "$files"; then
            echo "formula=true" >> "$GITHUB_OUTPUT"
          else
            echo "formula=false" >> "$GITHUB_OUTPUT"
          fi

  style:
    name: brew style and audit
    needs: changes
    if: needs.changes.outputs.formula == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      released: ${{ steps.placeholders.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
      # Homebrew loads no formula from an untrusted non-official tap.
      - name: Tap and trust this checkout
        run: |
          brew tap "$TAP" "$GITHUB_WORKSPACE"
          brew trust "$TAP"
      - run: brew style "$FORMULA"
      - run: brew audit --strict --formula "$FORMULA"
      - name: Check for placeholder values
        id: placeholders
        run: |
          if grep -q PLACEHOLDER Formula/skills_lint.rb; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  targets:
    name: List the targets
    needs: changes
    if: needs.changes.outputs.formula == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    defaults:
      run:
        working-directory: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - id: matrix
        run: dart run bin/release.dart homebrew-matrix >> "$GITHUB_OUTPUT"

  install:
    name: brew install and test (${{ matrix.target }})
    needs: [style, targets]
    if: needs.style.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
      # Homebrew loads no formula from an untrusted non-official tap.
      - name: Tap and trust this checkout
        run: |
          brew tap "$TAP" "$GITHUB_WORKSPACE"
          brew trust "$TAP"
      - run: brew install "$FORMULA"
      - run: brew test "$FORMULA"
      - run: brew audit --strict --online --formula "$FORMULA"

  homebrew:
    name: Homebrew
    needs: [changes, style, targets, install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
