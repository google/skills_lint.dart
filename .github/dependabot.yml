# Dependabot version updates for the actions and reusable workflows that
# .github/workflows/ uses. One group matches every action, so each update is
# one pull request that changes every workflow at once.
# packages/skills_lint/repo_test/action_pins_test.dart fails if two uses of an
# action have different pins.
#
# Options: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: github-actions
    # For GitHub Actions, "/" means .github/workflows/.
    directory: /
    schedule:
      interval: monthly
    # Dependabot proposes a version only after it has been out this many
    # days, so a compromised release has time to be found and pulled first.
    # 7 is the minimum that zizmor's dependabot-cooldown audit accepts by
    # default: https://docs.zizmor.sh/audits/#dependabot-cooldown
    # GitHub Actions updates support only default-days, not the semver-*-days
    # keys: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#cooldown-
    cooldown:
      default-days: 7
    # Pin updates are internal-only changes. See "Changelog" in
    # .agents/skills/definition-of-done/SKILL.md.
    labels:
      - skip-changelog-check
    groups:
      github-actions:
        patterns:
          - "*"
