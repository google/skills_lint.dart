# Analysis options for repo_test/. Everything comes from the package's
# options, plus one change.
#
# The analyzer treats a file as test code only if its path contains test/,
# integration_test/, test_driver/ or testing/ (`inTestDir` in package:analyzer),
# and pubspec.yaml has no setting for this. So @visibleForTesting members used
# here would be reported, although repo_test/ is test code.
include: ../analysis_options.yaml

analyzer:
  errors:
    invalid_use_of_visible_for_testing_member: ignore
