# Configuration for package:test. See
# https://github.com/dart-lang/test/blob/master/pkgs/test/doc/configuration.md
#
# Tests are split by directory. See "Where tests go" in CONTRIBUTING.md.
#
#   test/linter/               skills_lint, the shipped package, works.
#   test/convention_checkers/  the helpers in test/src/ that the repo
#                              convention checks use work.
#   test/repo_conventions/     this repository follows its own conventions.
#
# `dart test` runs all three. Each preset runs one directory, for example
# `dart test -P linter`. `dart test test/linter` does the same.
presets:
  linter:
    paths: [test/linter]
  convention_checkers:
    paths: [test/convention_checkers]
  repo_conventions:
    paths: [test/repo_conventions]
