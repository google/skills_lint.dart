skills_lint:
  rules:
    check-relative-paths: error
    check-absolute-paths: error
  directories:
    - path: ".agents/skills"
      rules:
        check-trailing-whitespace: error
        path-does-not-exist:
          severity: error
          exclude: ".*-workspace"
      ignore_file: ".agents/skills/ignore.json"
    - path: "packages/skills_lint/skills"
      rules:
        check-relative-paths:
          severity: error
          within-skill: true
        check-trailing-whitespace: error
        published-skill-name: error
        pub-archive-includes-skill: error
    - path: "packages/skills_lint/example/skills/invalid"
      rules:
        prevent-skills-sh-publishing: error
    - path: "packages/skills_lint/example/skills/valid"
      rules:
        prevent-skills-sh-publishing: error
  # Tracked internal skills in .agents/skills/ (unlike the third_party/
  # symlinks in .agents/skills/).
  # packages/skills_lint/repo_test/tracked_skills_publishing_test.dart checks
  # that every git-tracked skill directory under .agents/skills/ enables
  # prevent-skills-sh-publishing here.
  individual_skills:
    - path: ".agents/skills/add-dart-lint-validation-rule"
      rules:
        prevent-skills-sh-publishing: error
    - path: ".agents/skills/add-repo-convention-check"
      rules:
        prevent-skills-sh-publishing: error
    - path: ".agents/skills/check-downstream-consumers"
      rules:
        prevent-skills-sh-publishing: error
    - path: ".agents/skills/definition-of-done"
      rules:
        prevent-skills-sh-publishing: error
    - path: ".agents/skills/run-evals"
      rules:
        prevent-skills-sh-publishing: error
    - path: ".agents/skills/contributor-pr-description"
      rules:
        prevent-skills-sh-publishing: error
    - path: ".agents/skills/update-agent-guidance"
      rules:
        prevent-skills-sh-publishing: error

